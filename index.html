<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>愛犬健康管理系統</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EEF5FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="愛犬健康">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF5FB;--bgimg:linear-gradient(160deg,#E6F2FC 0%,#F3EFFB 52%,#FDF0F4 100%);--card:rgba(255,255,255,.7);--edge:rgba(255,255,255,.85);--ink:#2E3A4F;--sub:#6F809B;--line:rgba(150,178,210,.35);--pri:#3B7FC4;--pri2:rgba(120,170,225,.17);--warn:#C94B62;--warn2:#FDE6EA;--amb:#A8700D;--amb2:#FFF1D6;--ok:#2B8A6C;--ok2:#DFF4EC;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}


*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bgimg);background-attachment:fixed;background-color:var(--bg);color:var(--ink);font:400 15px/1.55 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:1px solid var(--edge);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{font-weight:900;font-size:16px;padding:0 10px 14px;display:flex;align-items:center;gap:8px}
.logo i{font-style:normal;background:var(--pri);color:#fff;border-radius:10px;width:32px;height:32px;display:grid;place-items:center;font-size:17px}
.nb{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--sub);font-weight:500;text-align:left;width:100%}
.nb:hover{background:var(--pri2)}.nb.on{background:var(--pri2);color:var(--pri);font-weight:700}
.nb svg{width:20px;height:20px;flex:none}
.main{padding:24px clamp(14px,3vw,36px) 40px;max-width:1040px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:24px;margin:0;font-weight:900}h2{font-size:16px;margin:0 0 10px;font-weight:700}
.pets{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.pet{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;font-weight:500}
.pet b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--pri2);font-size:15px}
.pet.on{border-color:var(--pri);background:var(--pri2);font-weight:700}
.btn{background:var(--pri);color:#fff;border:0;border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer}
.btn.g{background:var(--pri2);color:var(--pri)}
.btn:focus-visible,.nb:focus-visible,.pet:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.2fr 1fr}
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--edge);box-shadow:0 8px 28px rgba(110,150,200,.14);border-radius:22px;padding:16px}
.stat small{color:var(--sub);display:block}.stat b{font-size:28px;font-weight:900;letter-spacing:-.5px}
.stat .d{font-size:13px;font-weight:500}.up{color:var(--warn)}.dn{color:var(--ok)}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:132px;height:132px;border-radius:50%;flex:none;position:relative}
.ring::after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
.leg{flex:1;min-width:150px;display:grid;gap:6px;font-size:14px}
.leg div{display:flex;align-items:center;gap:8px}.leg i{width:10px;height:10px;border-radius:3px;flex:none}.leg span{margin-left:auto;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:12px;color:var(--sub)}
.bar div{width:100%;max-width:44px;background:var(--pri2);border-radius:6px 6px 0 0;min-height:3px}
.bar.cur div{background:var(--pri)}.bar em{font-style:normal;color:var(--ink);font-weight:700;font-size:12px}
.rem{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rem:first-of-type{border-top:0}
.stamp{width:62px;flex:none;text-align:center;border:2px solid;border-radius:10px;padding:4px 0;line-height:1.1}
.stamp b{font-size:22px;font-weight:900;display:block}.stamp small{font-size:11px}
.s-late{color:var(--warn);background:var(--warn2)}.s-soon{color:var(--amb);background:var(--amb2)}.s-ok{color:var(--ok);background:var(--ok2)}
.rem .t{flex:1;min-width:0}.rem .t b{display:block}.rem .t span{color:var(--sub);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;color:#fff;flex:none}
.row .n{flex:1;min-width:0}.row .n span{display:block;color:var(--sub);font-size:13px}
.amt{font-weight:700;font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:var(--sub);cursor:pointer;font-size:18px;padding:4px 8px}
.pcard{display:flex;gap:14px;align-items:center}
.av{width:64px;height:64px;border-radius:18px;background:var(--pri2);display:grid;place-items:center;font-size:34px;flex:none}
.pcard dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px;color:var(--sub)}.pcard dd{margin:0;color:var(--ink)}
dialog{border:1px solid var(--edge);border-radius:22px;background:#fff;box-shadow:0 20px 50px rgba(90,130,190,.25);color:var(--ink);padding:20px;width:min(420px,92vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
.f{display:grid;gap:4px;margin-bottom:12px;font-size:13px;color:var(--sub)}
.f input,.f select,.f textarea{font-family:inherit;resize:vertical;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:15px;color:var(--ink)}
.empty{color:var(--sub);text-align:center;padding:24px 0}
.note{font-size:12px;color:var(--sub);margin-top:14px}#sbox label{display:grid;gap:4px}.chip input{margin-right:4px}
.tabbar{display:none}
@media(max-width:820px){
.app{display:block}.side{display:none}
.main{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.g3,.g2{grid-template-columns:1fr}
.g3.s{grid-template-columns:1fr 1fr}.g3.s .card:first-child{grid-column:1/-1}
.tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--edge);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabbar .nb{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;justify-content:center;align-items:center;text-align:center}
}
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:var(--bgimg);background-color:var(--bg)}
#gate .card{max-width:380px;width:100%;text-align:center;padding:28px 22px}
#gate .btn{padding:11px 18px;font-size:15px}
.sync{position:fixed;right:14px;bottom:14px;z-index:20;font-size:12px;border-radius:999px;padding:5px 12px;background:rgba(255,255,255,.92);border:1px solid var(--line);color:var(--sub);transition:opacity .4s;opacity:0}
.sync.err{color:var(--warn);cursor:pointer;border-color:var(--warn)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:30px;z-index:60;background:rgba(46,58,79,.92);color:#fff;font-size:13px;border-radius:999px;padding:8px 18px;transition:opacity .3s;opacity:0;pointer-events:none;max-width:88vw;text-align:center}
@media(max-width:820px){.sync{bottom:calc(76px + env(safe-area-inset-bottom,0px))}#toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="logo"><i>🐾</i>愛犬健康管理系統</div><div id="nav1"></div></aside>
<main class="main" id="main"></main>
</div>
<nav class="tabbar" id="nav2"></nav>

<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="gate"><div class="card"><div class="logo" style="justify-content:center;padding:0 0 12px"><i>🐾</i>愛犬健康管理系統</div><h2 id="gt" style="margin:0 0 8px">載入中…</h2><p id="gm" style="color:var(--sub);margin:0 0 16px"></p><div id="gb" style="display:grid;gap:8px"></div></div></div>
<div id="sync" class="sync"></div><div id="toast"></div>

<script>
var C={deworm:['驅蟲藥','#3FA58A'],food:['飼料','#D99A2B'],can:['罐頭','#C98A5B'],snack:['零食','#B7A15C'],fresh:['鮮食團購','#7DB04A'],supp:['保健品','#A67FD0'],clean:['清潔保養','#4BB3D6'],vet:['看診','#DE6B7B'],vaccine:['疫苗','#4C8DDB'],insurance:['保險','#6C74D8'],supplies:['用品','#E08A55'],groom:['美容','#C46FB0'],other:['其他','#8C9AB0']};
var IC={inc:'<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',vet:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/>',home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',coin:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.7 1.7 0 0 1 0 3.4h-3a1.7 1.7 0 0 0 0 3.4h4.3"/>',bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',paw:'<circle cx="7" cy="10" r="2"/><circle cx="12" cy="6.5" r="2"/><circle cx="17" cy="10" r="2"/><path d="M12 12c-3 0-5 3-5 5 0 2 2 2 5 1 3 1 5 1 5-1 0-2-2-5-5-5z"/>'};
var TABS=[['home','總覽','home'],['cost','花費','coin'],['inc','收入紀錄','inc'],['rem','提醒','bell'],['visit','看診','vet'],['pets','寵物','paw']];
var view='home',cur='p1',filt='all',mon=0,dfrom='',dto='',sortAsc=false;
var today=new Date();today.setHours(0,0,0,0);
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function off(n){var d=new Date(today);d.setDate(d.getDate()+n);return dstr(d)}
function mk(back,day){var d=new Date(today.getFullYear(),today.getMonth()-back,day);return dstr(d)}
var pets=[{id:'p1',name:'狗狗一',k:'dog',sp:'',bd:'',kg:'',w:0},{id:'p2',name:'狗狗二',k:'dog',sp:'',bd:'',kg:'',w:0},{id:'p3',name:'貓咪',k:'cat',sp:'',bd:'',kg:'',w:0}];
var ex=[],vs=[],rm=[],incs=[],inv={};
var _lastId=0;function nid(){var n=Date.now();if(n<=_lastId)n=_lastId+1;_lastId=n;return n}
function save(){if(window.Cloud&&window.Cloud.changed)window.Cloud.changed()}
function $(x){return document.getElementById(x)}
function money(n){return 'NT$ '+Math.round(n).toLocaleString('zh-TW')}
function pet(i){return pets.filter(function(p){return p.id==i})[0]}
function mkey(o){var d=new Date(today.getFullYear(),today.getMonth()-o,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function mine(){return ex.filter(function(e){return e.cat!='fresh'&&(cur=='all'||e.pet==cur)})}
function sum(l){return l.reduce(function(a,e){return a+e.amt},0)}
function days(s){var p=s.split('-');return Math.round((new Date(+p[0],p[1]-1,+p[2])-today)/864e5)}
function nav(){var h=TABS.map(function(t){return '<button class="nb'+(view==t[0]?' on':'')+'" data-v="'+t[0]+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+IC[t[2]]+'</svg>'+t[1]+'</button>'}).join('');
$('nav1').innerHTML=h;$('nav2').innerHTML=h;
document.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){view=b.dataset.v;draw()}})}
function picker(){return '<div class="pets"><button class="pet'+(cur=='all'?' on':'')+'" data-p="all">全部</button>'+pets.map(function(p){return '<button class="pet'+(cur==p.id?' on':'')+'" data-p="'+p.id+'">'+p.name+'</button>'}).join('')+'</div>'}
function head(t,btn){return '<div class="top"><h1>'+t+'</h1>'+(btn||'')+'</div><div style="margin-bottom:16px">'+picker()+'</div>'}
function rmList(l){l=l.slice().sort(function(a,b){return (!a.iv-!b.iv)||days(a.due)-days(b.due)});
if(!l.length)return '<div class="empty">還沒有提醒，按右上角新增</div>';
return l.map(function(r){var d=days(r.due),k=d<0?'s-late':d<=14?'s-soon':'s-ok';
if(!r.iv)return '<div class="rem" style="opacity:.75"><div class="stamp" style="border-color:var(--line);color:var(--sub)"><b>—</b><small>不提醒</small></div><div class="t"><b>'+esc(r.t)+(cur=='all'?'（'+pet(r.pet).name+'）':'')+'</b><span>'+r.due+'・不提醒</span></div><div style="display:grid;gap:6px;text-align:center"><button class="btn g" style="font-size:13px;padding:6px 12px" data-edr="'+r.id+'">編輯</button><button class="btn g" style="font-size:13px;padding:6px 12px" data-delr="'+r.id+'">刪除</button></div></div>';
return '<div class="rem"><div class="stamp '+k+'" style="border-color:currentColor"><b>'+Math.abs(d)+'</b><small>'+(d<0?'天前到期':d==0?'今天':'天後')+'</small></div><div class="t"><b>'+r.t+(cur=='all'?'（'+pet(r.pet).name+'）':'')+'</b><span>'+r.due+'・每 '+(r.iv==12?'年':r.iv+' 個月')+' 一次</span></div><div style="display:grid;gap:6px;text-align:center"><button class="btn g" data-done="'+r.id+'">已完成</button><a class="btn g" style="text-decoration:none;font-size:13px;padding:6px 12px" target="_blank" rel="noopener" href="'+gcal(r)+'">加入行事曆</a><div style="display:flex;gap:6px"><button class="btn g" style="font-size:12px;padding:4px 10px" data-edr="'+r.id+'">編輯</button><button class="btn g" style="font-size:12px;padding:4px 10px" data-delr="'+r.id+'">刪除</button></div></div></div>'}).join('')}
function gcal(r){var d=r.due.replace(/-/g,''),p=r.due.split('-'),e=dstr(new Date(+p[0],+p[1]-1,+p[2]+1)).replace(/-/g,''),y=r.iv==12;return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('🐾 '+(r.pet?pet(r.pet).name+'：':'')+r.t)+'&dates='+d+'/'+e+(r.iv?'&recur='+encodeURIComponent('RRULE:FREQ='+(y?'YEARLY':'MONTHLY')+';INTERVAL='+(y?1:r.iv)):'')+'&details='+encodeURIComponent('愛犬健康管理系統提醒')}
function vHome(){var l=mine(),k0=mkey(0),k1=mkey(1);
var t0=sum(l.filter(function(e){return e.date.slice(0,7)==k0})),t1=sum(l.filter(function(e){return e.date.slice(0,7)==k1})),ty=sum(l.filter(function(e){return e.date.slice(0,7)>=mkey(5)}));
var df=t1?Math.round((t0-t1)/t1*100):0;
var cats={};l.filter(function(e){return e.date.slice(0,7)==k0}).forEach(function(e){cats[e.cat]=(cats[e.cat]||0)+e.amt});
var tot=t0||1,acc=0,grad=[],leg='';
Object.keys(cats).forEach(function(c){var p=cats[c]/tot*100;grad.push(C[c][1]+' '+acc+'% '+(acc+p)+'%');acc+=p;leg+='<div><i style="background:'+C[c][1]+'"></i>'+C[c][0]+'<span>'+money(cats[c])+'</span></div>'});
if(!grad.length){grad=['var(--line) 0 100%'];leg='<div class="empty" style="padding:0">本月還沒有花費</div>'}
var rl=rm.filter(function(r){return r.iv&&(cur=='all'||r.pet==cur)});
return head('愛犬健康管理系統')+hint()+'<div class="grid g3 s"><div class="card stat"><small>本月花費</small><b>'+money(t0)+'</b><div class="d '+(df>0?'up':'dn')+'">'+(t1?(df>0?'比上月多 ':'比上月少 ')+Math.abs(df)+'%':'上月無資料')+'</div></div><div class="card stat"><small>近 6 個月合計</small><b>'+money(ty)+'</b><div class="d" style="color:var(--sub)">平均每月 '+money(ty/6)+'</div></div><div class="card stat"><small>待處理提醒</small><b>'+rl.filter(function(r){return days(r.due)<=14}).length+' 項</b><div class="d up">'+rl.filter(function(r){return days(r.due)<0}).length+' 項已逾期</div></div></div>'
+''+freshCard('margin-top:14px')+stockCards('margin-top:14px')+'<div class="grid g2" style="margin-top:14px"><div class="card"><h2>本月花費分類</h2><div class="donut"><div class="ring" style="background:conic-gradient('+grad.join(',')+')"></div><div class="leg">'+leg+'</div></div></div>'
+'<div class="card"><h2>近期提醒</h2>'+rmList(rl).split('<div class="rem">').slice(0,4).join('<div class="rem">')+'</div></div></div>'
+'<div class="card" style="margin-top:14px"><h2>每月花費趨勢</h2><div class="bars">'+[5,4,3,2,1,0].map(function(o){var k=mkey(o),v=sum(l.filter(function(e){return e.date.slice(0,7)==k})),mx=Math.max.apply(null,[5,4,3,2,1,0].map(function(q){var kk=mkey(q);return sum(l.filter(function(e){return e.date.slice(0,7)==kk}))}))||1;
return '<div class="bar'+(o==0?' cur':'')+'"><em>'+(v?Math.round(v/100)/10+'k':'')+'</em><div style="height:'+Math.max(v/mx*100,2)+'%"></div>'+k.slice(5)+' 月</div>'}).join('')+'</div></div>'}
function vCost(){var l=(filt=='fresh'?ex.filter(function(e){return e.cat=='fresh'}):mine()).filter(function(e){return filt=='all'||e.cat==filt}).filter(function(e){return(!dfrom||e.date>=dfrom)&&(!dto||e.date<=dto)}).sort(function(a,b){return(a.date<b.date?1:-1)*(sortAsc?-1:1)});
var chips='<div class="chips"><button class="chip'+(filt=='all'?' on':'')+'" data-f="all">全部</button>'+Object.keys(C).map(function(c){return '<button class="chip'+(filt==c?' on':'')+'" data-f="'+c+'">'+C[c][0]+'</button>'}).join('')+'</div>';

<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const $g = id => document.getElementById(id);
const Cloud = window.Cloud = { user: null, changed() {}, reload() {}, out() {}, allowMass() {} };

function showGate(title, msg, buttons) {
  $g('gate').style.display = 'grid';
  $g('gt').textContent = title;
  $g('gm').textContent = msg || '';
  const box = $g('gb'); box.textContent = '';
  (buttons || []).forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.ghost ? ' g' : ''); el.textContent = b.t; el.onclick = b.fn; box.appendChild(el);
  });
}
const hideGate = () => { $g('gate').style.display = 'none'; };

const cfgOk = firebaseConfig && firebaseConfig.apiKey && !/^請/.test(firebaseConfig.apiKey);
if (!cfgOk) {
  showGate('尚未完成設定', '請把 Firebase 的 firebaseConfig 貼進 firebase-config.js，存檔後重新整理。', []);
} else {
  start();
}

function start() {
  const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
  auth.languageCode = 'zh-TW';
  const COLL = ['ex', 'vs', 'rm', 'incs'];
  let uid = null, ready = false, synced = new Map(), timer = null, busy = false, again = false, failed = false, retry = null, massOk = false, loadedAt = 0;

  const canon = v => Array.isArray(v) ? '[' + v.map(canon).join(',') + ']'
    : (v && typeof v === 'object') ? '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}'
    : JSON.stringify(v === undefined ? null : v);

  function collect() {
    const S = window.App.get(), m = new Map();
    for (const c of COLL) for (const r of S[c]) m.set(c + '/' + r.id, { c, id: String(r.id), json: canon(r) });
    m.set('meta/main', { c: 'meta', id: 'main', json: canon({ pets: S.pets, inv: S.inv }) });
    return m;
  }

  async function load(u) {
    const snaps = await Promise.all(COLL.map(c => getDocs(collection(db, 'users', u, c))));
    const meta = await getDoc(doc(db, 'users', u, 'meta', 'main'));
    const D = {};
    COLL.forEach((c, i) => { D[c] = snaps[i].docs.map(d => d.data()).sort((a, b) => a.id - b.id); });
    const m = meta.exists() ? meta.data() : {};
    D.pets = m.pets; D.inv = m.inv || {};
    window.App.apply(D);
    synced = new Map(); collect().forEach((v, k) => synced.set(k, v.json));
    if (!meta.exists()) synced.delete('meta/main'); // 雲端還沒有 meta 文件：第一次儲存時一併建立
    loadedAt = Date.now();
  }

  async function flush() {
    if (!ready || !uid) return;
    if (busy) { again = true; return; }
    busy = true;
    try {
      do {
        again = false;
        const cur = collect(), ops = [];
        cur.forEach((v, k) => { if (synced.get(k) !== v.json) ops.push({ t: 'set', k, v }); });
        synced.forEach((_, k) => { if (!cur.has(k)) { const [c, id] = k.split('/'); ops.push({ t: 'del', k, c, id }); } });
        if (!ops.length) continue;
        if (ops.filter(o => o.t === 'del').length > 10 && !massOk) throw new Error('blocked: mass delete');
        setSync('busy', '儲存中…');
        for (let i = 0; i < ops.length; i += 400) {
          const part = ops.slice(i, i + 400), b = writeBatch(db);
          for (const o of part) {
            if (o.t === 'set') b.set(doc(db, 'users', uid, o.v.c, o.v.id), JSON.parse(o.v.json));
            else b.delete(doc(db, 'users', uid, o.c, o.id));
          }
          await b.commit();
          for (const o of part) { if (o.t === 'set') synced.set(o.k, o.v.json); else synced.delete(o.k); }
        }
        massOk = false;
      } while (again);
      failed = false; clearTimeout(retry); setSync('ok', '已同步');
    } catch (e) {
      console.error(e); failed = true; setSync('err', '儲存失敗，點此重試');
      clearTimeout(retry); retry = setTimeout(flush, 8000);
    } finally { busy = false; }
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function flushNow() { clearTimeout(timer); timer = null; await flush(); while (busy) await sleep(60); }
  const pending = () => !!timer || busy || again || failed;

  Cloud.changed = () => { if (!ready) return; setSync('busy', '儲存中…'); clearTimeout(timer); timer = setTimeout(() => { timer = null; flush(); }, 600); };
  Cloud.allowMass = () => { massOk = true; };
  Cloud.reload = async () => {
    if (!ready) return;
    await flushNow();
    if (failed) { toast('還有未儲存的變更，請先處理後再重新載入'); return; }
    try { setSync('busy', '載入中…'); await load(uid); window.App.draw(); setSync('ok', '已更新'); }
    catch (e) { console.error(e); setSync('err', '載入失敗'); }
  };
  Cloud.out = async () => {
    await flushNow();
    if (failed) { toast('還有未儲存的變更，無法登出'); return; }
    ready = false; uid = null; synced = new Map(); clearTimeout(timer);
    window.App.clear(); Cloud.user = null;
    await signOut(auth);
  };
  $g('sync').addEventListener('click', () => { if (failed) flush(); });
  window.addEventListener('beforeunload', e => { if (pending()) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && ready && !pending() && Date.now() - loadedAt > 600000 && !window.App.dialogOpen()) Cloud.reload();
  });

  const loginMsg = {
    'auth/unauthorized-domain': '這個網址還沒加入授權網域。請到 Firebase → Authentication → Settings → 授權網域，加入 ' + location.hostname,
    'auth/network-request-failed': '網路連線失敗，請檢查網路後再試。'
  };
  function showLogin(err) {
    showGate('請先登入', err || '僅限授權帳號使用。', [{ t: '使用 Google 登入', fn: doLogin }]);
  }
  async function doLogin() {
    const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
    try { await signInWithPopup(auth, p); }
    catch (e) {
      if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/web-storage-unsupported'].includes(e.code)) {
        try { await signInWithRedirect(auth, p); } catch (e2) { showLogin('登入失敗：' + (loginMsg[e2.code] || e2.code || e2.message)); }
      } else if (!['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(e.code)) {
        showLogin('登入失敗：' + (loginMsg[e.code] || e.code || e.message));
      }
    }
  }
  getRedirectResult(auth).catch(e => showLogin('登入失敗：' + (loginMsg[e.code] || e.code || e.message)));

  onAuthStateChanged(auth, async user => {
    if (!user) { ready = false; uid = null; Cloud.user = null; showLogin(); return; }
    showGate('載入資料中…', '', []);
    try {
      await load(user.uid);
      uid = user.uid; ready = true; Cloud.user = user.email;
      hideGate(); window.App.draw(); setSync('ok', '已同步');
    } catch (e) {
      console.error(e);
      const denied = e && e.code === 'permission-denied';
      showGate(denied ? '沒有資料庫權限' : '載入失敗',
        denied ? '資料庫規則拒絕了這個帳號。請確認已貼上 firestore.rules 並發布，且登入的是授權的 Google 帳號。' : '請檢查網路後再試。',
        [{ t: '重試', fn: () => location.reload() }, { t: '登出', ghost: true, fn: () => signOut(auth) }]);
    }
  });
}
